<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis lecturas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#23201c;--mute:#7b756c;--line:#e6e0d6;--acc:#2f6f5e;--acc2:#e8f1ee;--warn:#b3472f}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--ink:#efebe4;--mute:#9a948a;--line:#34312d;--acc:#6fc2a9;--acc2:#1f2d29;--warn:#e07b62}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top)) 14px 90px}
h1{font-size:22px;margin:6px 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.cover{width:46px;height:64px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mute);font-size:13px}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
button{font:inherit}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.bad{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:6px 10px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:calc(100vh - 64px - env(safe-area-inset-top));overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stars button{border:0;background:none;font-size:28px;color:var(--line);padding:0 2px}
.stars button.on{color:#e0a526}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal.head span{text-align:center;font-size:12px;color:var(--mute)}
.day{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;color:#1b2b22}
.day small{font-size:10px;opacity:.7}.day b{font-size:13px;text-align:center;font-weight:600}
.day.today{outline:2px solid var(--acc);outline-offset:1px}
.l0{background:#fff}.l1{background:#d4edda}.l2{background:#9fd5ac}.l3{background:#4fa768;color:#fff}.l4{background:#1f6b3a;color:#fff}
.day.l3,.day.l4{color:#fff}
.legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.yb{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px}
.yb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.yb i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.yb span{font-size:10px;color:var(--mute)}
.lbl{display:flex;gap:4px;font-size:10px;color:var(--mute);margin-top:2px}
.lbl span{flex:1;text-align:center}
button:disabled{opacity:.35}
.filebtn{position:relative;overflow:hidden;display:inline-block;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:calc(60px + env(safe-area-inset-top)) 12px 24px;overflow:auto}
.viewer img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:8px;flex:none}
.cropbox{position:relative;display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0;flex:none;max-width:100%}
.viewer .cropbox img{display:block;max-width:calc(100vw - 24px);max-height:58vh;width:auto;height:auto;-webkit-user-drag:none}
.sel{position:absolute;border:2px solid #ffd54a;background:rgba(255,213,74,.2);pointer-events:none;box-sizing:border-box}
.vbar{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px;flex-wrap:wrap;justify-content:center}
.ocr{width:100%;max-width:560px;background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px 12px}
.q{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.warn{background:var(--acc2);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.langbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:flex-end;gap:6px;padding:max(6px,env(safe-area-inset-top)) 12px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.flag{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 7px;font-size:12px;font-weight:600}
.flag.on{outline:2px solid var(--acc);outline-offset:-1px}
.flag svg{width:22px;height:15px;display:block;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.3)}
</style>
</head>

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,2600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

function prepOcr(blob,sel){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    const sx=sel?Math.round(sel.x*im.width):0,sy=sel?Math.round(sel.y*im.height):0;
    const sw=sel?Math.max(1,Math.round(sel.w*im.width)):im.width,sh=sel?Math.max(1,Math.round(sel.h*im.height)):im.height;
    const up=Math.min(3,Math.max(1,1400/Math.max(sw,sh)));
    const c=document.createElement('canvas');c.width=Math.round(sw*up);c.height=Math.round(sh*up);
    const g=c.getContext('2d');g.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
    const d=g.getImageData(0,0,c.width,c.height),a=d.data,h=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4){const y=((a[i]*299+a[i+1]*587+a[i+2]*114)/1000)|0;a[i]=y;h[y]++}
    const n=c.width*c.height;let lo=0,hi=255,sm=0;
    while(lo<255&&sm+h[lo]<n*.02){sm+=h[lo];lo++}
    sm=0;while(hi>0&&sm+h[hi]<n*.02){sm+=h[hi];hi--}
    const k=hi>lo?255/(hi-lo):1;
    for(let i=0;i<a.length;i+=4){const y=Math.max(0,Math.min(255,(a[i]-lo)*k));a[i]=a[i+1]=a[i+2]=y}
    g.putImageData(d,0,0);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(),'image/png')};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

function cleanText(raw,ocr){
  const cjk=ocr==='jpn';
  let s=String(raw||'').replace(/\r/g,'').replace(/\u00ad/g,'');
  s=s.replace(/(\p{L})[-\u2010\u2011]\n(?=\p{Ll})/gu,'$1');
  let out=s.split(/\n\s*\n/).map(p=>p.split('\n').map(l=>l.trim()).filter(Boolean).join(cjk?'':' ').replace(/[ \t]{2,}/g,' ').trim())
    .filter(p=>p&&!/^\d{1,4}$/.test(p));
  if(cjk)out=out.map(p=>p.replace(/(?<=[\u3000-\u9fff\uff00-\uffef]) (?=[\u3000-\u9fff\uff00-\uffef])/g,''));
  return out.join('\n\n');
}

function chunks(text,max){
  const enc=new TextEncoder(),out=[];let cur='';
  const flush=()=>{if(cur.trim())out.push(cur.trim());cur=''};
  for(let p of text.split(/(?<=[.!?。！？…])\s*/)){
    while(enc.encode(p).length>max){let i=p.length;while(i>1&&enc.encode(p.slice(0,i)).length>max)i=Math.floor(i*0.9);flush();out.push(p.slice(0,i));p=p.slice(i)}
    if(cur&&enc.encode(cur+' '+p).length>max)flush();
    cur=cur?cur+' '+p:p;
  }
  flush();return out;
}

async function mm(q,src,dst){

  const d=await r.json();
  const txt=(d.responseData&&d.responseData.translatedText)||'';
  if(d.quotaFinished||String(d.responseStatus)==='429'||/^MYMEMORY WARNING/i.test(txt))throw new Error('limit');
  if(String(d.responseStatus)!=='200'||!txt)throw new Error('fail');

}

      const res=[];
      for(const p of paras){const o=[];for(const c of chunks(p,450))o.push(await mm(c,src,dst));res.push(o.join(' '))}

  ${(b.quotes||[]).map((q,i)=>`<div class="q">${esc(q.text)}${q.page?` <span class="m">(${esc(t('pg_abbr'))} ${esc(q.page)})</span>`:''} <button class="chip" style="padding:0 8px;margin-left:6px" data-act="delq" data-id="${i}">×</button></div>`).join('')}
  <div class="grid" style="grid-template-columns:3fr 1fr"><input id="qt" placeholder="${esc(t('new_quote'))}"><input id="qp" placeholder="${esc(t('pg_short'))}" inputmode="numeric"></div>
  <button class="btn sec sm" style="margin-top:6px" data-act="addq">${esc(t('add_quote'))}</button>
  ${(b.quotes||[]).length?`<div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sec sm" data-act="qcopy">${esc(t('q_copy'))}</button><button class="btn sec sm" data-act="qshare">${esc(t('q_share'))}</button><span class="m" id="qmsg"></span></div>`:''}
  <div style="margin-top:22px"><button class="btn bad" data-act="del">${esc(delArm?t('del_confirm'):t('del_book'))}</button></div>
  </div></div>`;
}
function sheetAdd(){
  const l=lookup||{};
  return `<div class="sheet" data-act="closebg"><div>
  <div class="row"><h1 class="grow" style="margin:0">${esc(t('new_book'))}</h1><button class="btn sec sm" data-act="close">${esc(t('close'))}</button></div>
  <label>ISBN</label>
  <div class="row" style="gap:8px"><input id="ni" inputmode="numeric" value="${esc(l.isbn||'')}"><button class="btn sec sm" data-act="scan" style="white-space:nowrap">${esc(t('scan_isbn'))}</button></div>
  <button class="btn sec sm" style="margin-top:6px" data-act="isbn">${esc(t('isbn_search'))}</button>
  ${scanning?`<div class="m" style="margin:8px 0 4px">${esc(t('scan_hint'))}</div><video id="scanvid" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><button class="btn bad sm" style="margin-top:6px" data-act="scancancel">${esc(t('cancel'))}</button>`:''}
  <label>${esc(t('title'))}</label><input id="nt" value="${esc(l.title||'')}">
  <button class="btn sec sm" style="margin-top:6px" data-act="lookup">${esc(t('lookup'))}</button><div class="m" id="lkmsg">${esc(msg?t(msg):'')}</div>
  <label>${esc(t('author'))}</label><input id="na" value="${esc(l.author||'')}">
  <div class="grid"><div><label>${esc(t('pages'))}</label><input id="np" type="number" min="0" inputmode="numeric" value="${esc(l.pages||'')}"></div><div><label>${esc(t('edition_year'))}</label><input id="ny" type="number" min="0" inputmode="numeric" placeholder="${esc(t('eg'))}" value="${esc(l.year||'')}"></div></div>
  <label>${esc(t('status'))}</label><select id="ns"><option value="reading">${esc(stLabel('reading'))}</option><option value="done">${esc(stLabel('done'))}</option></select>
  <button class="btn" style="width:100%;margin-top:16px" data-act="create">${esc(t('add'))}</button>
  </div></div>`;
}
function sheetData(){
  const n=pendingBackup?pendingBackup.data.books.length:0;
  return `<div class="sheet" data-act="closebg"><div>
  <div class="row"><h1 class="grow" style="margin:0">${esc(t('backup'))}</h1><button class="btn sec sm" data-act="close">${esc(t('close'))}</button></div>
  <div class="m" style="margin-top:8px">${esc(t('backup_note'))}</div>
  <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-act="bkdl">${esc(t('bk_download'))}</button><button class="btn sec sm" data-act="bkshare">${esc(t('bk_share'))}</button><label class="btn sec sm filebtn" style="margin:0">${esc(t('bk_file_import'))}<input id="bkfile" type="file" accept=".json,application/json,text/plain"></label></div>
  ${pendingBackup?`<button class="btn bad sm" style="margin-top:8px" data-act="bkconfirm">${esc(t('bk_confirm',{n}))}</button>`:''}
  <div class="m" id="bkmsg" style="margin-top:6px"></div>
  <label>${esc(t('export_lbl'))}</label>
  <textarea id="exp" readonly style="min-height:110px">${esc(JSON.stringify(S))}</textarea>
  <button class="btn sec sm" style="margin-top:6px" data-act="copy">${esc(t('copy'))}</button> <span class="m" id="cpmsg"></span>
  <label>${esc(t('import_lbl'))}</label>
  <textarea id="imp" placeholder="${esc(t('paste_json'))}"></textarea>
  <button class="btn ${impArm?'bad':'sec'} sm" style="margin-top:6px" data-act="import">${esc(impArm?t('import_confirm'):t('import'))}</button> <span class="m" id="immsg"></span>
  </div></div>`;
}
function langbar(){
  return `<div class="langbar">${[['es','ESP'],['en','ING'],['it','ITA'],['de','ALE'],['fr','FRA'],['ja','JAP']].map(([k,c])=>`<button class="flag ${lang===k?'on':''}" data-act="lang" data-id="${k}" aria-label="${c}">${FLAG[k]}${lang===k?`<span>${c}</span>`:''}</button>`).join('')}</div>`;
}

function render(){
  let h=langbar();
  h+=view==='reading'?vReading():view==='library'?vLibrary():vStats();
  h+=`<button class="fab" data-act="add" aria-label="${esc(t('add_book_aria'))}">+</button>
  <nav>${[['reading','nav_reading'],['library','nav_library'],['stats','nav_stats']].map(([k,v])=>`<button class="${view===k?'on':''}" data-act="nav" data-id="${k}">${esc(t(v))}</button>`).join('')}</nav>`;
  if(openId&&get(openId))h+=sheetBook(get(openId))+(viewId?viewer():'');
  else if(adding)h+=sheetAdd();
  else if(dataSheet)h+=sheetData();
  $('#app').innerHTML=h;
}

function setStatus(b,s){
  b.status=s;
  if(s==='reading'&&!b.started)b.started=today();
  if(s==='done'){b.finished=today();if(!b.started)b.started=today();if(b.pages)b.current=b.pages}
  if(s!=='done')b.finished=b.finished&&s==='dropped'?b.finished:'';
}
function setLang(l){
  lang=l;ocrLang=OCRMAP[l];trLang=l;
  try{localStorage.setItem(LKEY,l)}catch(e){}
  document.documentElement.lang=l;document.title=t('app_title');
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='closebg'){if(e.target!==el)return;stopScan();pendingBackup=null;openId=null;viewId=null;draft={};adding=false;dataSheet=false;delArm=false;impArm=false;render();return}
  const b=openId?get(openId):null;
  switch(a){
    case 'lang':setLang(id);render();break;
    case 'nav':view=id;render();break;
    case 'open':openId=id;delArm=false;clearP();draft={};photoMsg='';viewId=null;render();loadPhotos(id).then(()=>{if(openId===id)render()});break;
    case 'close':stopScan();pendingBackup=null;openId=null;viewId=null;draft={};adding=false;dataSheet=false;delArm=false;impArm=false;lookup=null;msg='';render();break;
    case 'add':adding=true;lookup=null;msg='';render();break;
    case 'data':dataSheet=true;render();break;
    case 'mprev':if(calIdx>MIN_IDX)calIdx--;render();break;
    case 'mnext':if(calIdx<MAX_IDX)calIdx++;render();break;
    case 'ord':ordYear=id;render();break;
    case 'yprev':if(statY>MIN_Y)statY--;render();break;
    case 'ynext':if(statY<MAX_Y)statY++;render();break;
    case 'status':setStatus(b,id);save();render();break;
    case 'rate':b.rating=b.rating===+id?0:+id;save();render();break;
    case 'savenotes':b.notes=$('#notes').value;save();el.textContent=t('saved');break;
    case 'addq':{const q=$('#qt').value.trim();if(!q)break;(b.quotes=b.quotes||[]).push({text:q,page:$('#qp').value.trim()});save();render();break}
    case 'delq':b.quotes.splice(+id,1);save();render();break;
    case 'session':{
      const ini=parseInt($('#pi').value,10),np=parseInt($('#pg').value,10);
      if(isNaN(ini)||isNaN(np)||ini<0||np<ini){$('#pg').focus();break}
      b.current=b.pages?Math.min(np,b.pages):np;
      (b.sessions=b.sessions||[]).push({date:today(),pages:np-ini,from:ini,to:np});
      if(b.pages&&b.current>=b.pages)setStatus(b,'done');
      draft={};save();render();break}
    case 'del':if(!delArm){delArm=true;render();break}
      delBookPhotos(openId);S.books=S.books.filter(x=>x.id!==openId);openId=null;delArm=false;save();render();break;
    case 'photo':viewId=id;pdelArm=false;ocrStatus='';trStatus='';cropSel=null;render();break;
    case 'clearsel':cropSel=null;render();break;
    case 'viewbg':if(e.target===el){viewId=null;render()}break;
    case 'vclose':viewId=null;render();break;
    case 'vdel':{
      if(!pdelArm){pdelArm=true;render();break}
      try{const db=await idb();await reqP(pstore(db,'readwrite').delete(viewId))}catch(err){}
      viewId=null;pdelArm=false;await loadPhotos(openId);render();break}
    case 'ocr':runOcr();break;
    case 'translate':runTranslate();break;
    case 'trcopy':{
      const ta=$('#trtxt');ta.select();
      try{await navigator.clipboard.writeText(ta.value);$('#trmsg').textContent=t('copied')}catch(err){$('#trmsg').textContent=t('copy_manual')}
      break}
    case 'trquote':{
      const x=P.find(q=>q.id===viewId);if(!x||!b)break;
      const ta=$('#trtxt');
      const txt=(ta.value.slice(ta.selectionStart,ta.selectionEnd).trim()||ta.value.trim());
      if(!txt)break;
      (b.quotes=b.quotes||[]).push({text:txt,page:x.page?String(x.page):''});save();
      $('#trmsg').textContent=t('saved');break}
    case 'ocrsave':{
      const x=P.find(q=>q.id===viewId);if(!x)break;
      x.text=$('#ocrtxt').value;
      try{await savePhoto(x);$('#ocrmsg').textContent=t('saved')}catch(err){$('#ocrmsg').textContent=t('photo_fail')}
      break}
    case 'ocrclean':{
      const x=P.find(q=>q.id===viewId);if(!x)break;
      const ta=$('#ocrtxt');ta.value=cleanText(ta.value,ocrLang);x.text=ta.value;
      try{await savePhoto(x);$('#ocrmsg').textContent=t('saved')}catch(err){$('#ocrmsg').textContent=t('photo_fail')}
      break}
    case 'ocrcopy':{
      const ta=$('#ocrtxt');ta.select();
      try{await navigator.clipboard.writeText(ta.value);$('#ocrmsg').textContent=t('copied')}catch(err){$('#ocrmsg').textContent=t('copy_manual')}
      break}
    case 'ocrquote':{
      const x=P.find(q=>q.id===viewId);if(!x||!b)break;
      const ta=$('#ocrtxt');
      const txt=(ta.value.slice(ta.selectionStart,ta.selectionEnd).trim()||ta.value.trim());
      if(!txt)break;
      (b.quotes=b.quotes||[]).push({text:txt,page:x.page?String(x.page):''});save();
      $('#ocrmsg').textContent=t('saved');break}
    case 'lookup':{
      const f=readAddForm();if(!f.title)break;
      $('#lkmsg').textContent=t('searching');
      try{
        const r=await fetch('https://openlibrary.org/search.json?limit=1&fields=title,author_name,number_of_pages_median&q='+encodeURIComponent(f.title));
        const d=await r.json();const x=d.docs&&d.docs[0];
        if(!x){msg='no_results';lookup=f}
        else{msg='';lookup={...f,title:x.title,author:(x.author_name||[])[0]||f.author,pages:x.number_of_pages_median||f.pages}}
      }catch(err){msg='lookup_fail';lookup=f}
      render();break}
    case 'isbn':{
      const f=readAddForm(),code=f.isbn.replace(/[^0-9Xx]/g,'');
      if(!code){$('#ni').focus();break}
      lookup=f;await fillFromIsbn(code);break}
    case 'scan':lookup=readAddForm();startScan();break;
    case 'scancancel':stopScan();render();break;
    case 'create':{
      const f=readAddForm();if(!f.title){$('#nt').focus();break}
      const nb={id:uid(),title:f.title,author:f.author,pages:parseInt(f.pages,10)||0,year:parseInt(f.year,10)||0,isbn:f.isbn.replace(/[^0-9Xx]/g,''),cover:f.cover,status:'reading',current:0,rating:0,added:today(),started:'',finished:'',notes:'',quotes:[],sessions:[]};
      setStatus(nb,$('#ns').value);
      stopScan();S.books.push(nb);save();adding=false;lookup=null;msg='';render();break}
    case 'delsess':{
      const ss=b.sessions[+id];if(!ss)break;
      b.sessions.splice(+id,1);
      if(ss.from!=null&&ss.to===b.current)b.current=ss.from;
      save();render();break}
    case 'qcopy':{
      try{await navigator.clipboard.writeText(quotesMd([b]));$('#qmsg').textContent=t('copied')}catch(err){$('#qmsg').textContent=t('copy_manual')}
      break}
    case 'qshare':await shareText(b.title,quotesMd([b]),$('#qmsg'));break;
    case 'qall':{
      const tx=quotesMd(S.books),m=$('#qmsg');
      if(!tx){m.textContent=t('q_none');break}
      await shareText(t('quotes'),tx,m);break}
    case 'bkdl':{
      const m=$('#bkmsg');m.textContent=t('bk_working');
      const bk=await buildBackup();
      downloadBlob('lecturas-'+today()+'.json',new Blob([JSON.stringify(bk)],{type:'application/json'}));
      m.textContent=t('bk_done');break}
    case 'bkshare':{
      const m=$('#bkmsg');m.textContent=t('bk_working');
      const bk=await buildBackup();
      await shareFile('lecturas-'+today()+'.json',new Blob([JSON.stringify(bk)],{type:'application/json'}),'application/json');
      m.textContent=t('bk_done');break}
    case 'bkconfirm':{
      const pb=pendingBackup;if(!pb)break;
      S=pb.data;if(!Array.isArray(S.books))S.books=[];migrate();save();
      try{
        const db=await idb();await reqP(pstore(db,'readwrite').clear());
        for(const ph of pb.photos){const {data,...rest}=ph;const blob=await (await fetch(data)).blob();await reqP(pstore(db,'readwrite').put({...rest,blob}))}
      }catch(err){}
      pendingBackup=null;dataSheet=false;render();break}
    case 'copy':{
      const ta=$('#exp');ta.select();
      try{await navigator.clipboard.writeText(ta.value);$('#cpmsg').textContent=t('copied')}catch(err){$('#cpmsg').textContent=t('copy_manual')}
      break}
    case 'import':{
      if(!impArm){impArm=true;render();break}
      try{const d=JSON.parse($('#imp').value);if(!d||!Array.isArray(d.books))throw 0;S=d;migrate();save();impArm=false;dataSheet=false;render()}
      catch(err){impArm=false;render();$('#immsg').textContent=t('bad_json')}
      break}
  }
});
document.addEventListener('pointerdown',e=>{
  const box=e.target.closest&&e.target.closest('.cropbox');if(!box)return;
  const r=box.getBoundingClientRect();
  drag={box,r,x0:clamp01((e.clientX-r.left)/r.width),y0:clamp01((e.clientY-r.top)/r.height)};
  try{box.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const x1=clamp01((e.clientX-drag.r.left)/drag.r.width),y1=clamp01((e.clientY-drag.r.top)/drag.r.height);
  cropSel={x:Math.min(drag.x0,x1),y:Math.min(drag.y0,y1),w:Math.abs(x1-drag.x0),h:Math.abs(y1-drag.y0)};
  paintSel(drag.box);
});
function endDrag(){
  if(!drag)return;
  if(cropSel&&(cropSel.w<.05||cropSel.h<.05))cropSel=null;
  paintSel(drag.box);drag=null;
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('change',async e=>{
  if((e.target.id==='cam'||e.target.id==='gal')&&openId){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const bid=openId;draft={pi:($('#pi')||{}).value,pg:($('#pg')||{}).value};
    try{const blob=await shrink(f);const db=await idb();
      await reqP(pstore(db,'readwrite').put({id:uid(),bookId:bid,ts:Date.now(),date:today(),page:parseInt(draft.pg,10)||0,blob}));
      await loadPhotos(bid);photoMsg=''}
    catch(err){photoMsg='photo_fail'}
    if(openId===bid)render();
    draft={};return}
  if(e.target.id==='ocrlang'){ocrLang=e.target.value;return}
  if(e.target.id==='trlang'){trLang=e.target.value;return}
  if(e.target.id==='bkfile'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    let ok=false;
    try{const d=JSON.parse(await f.text());const data=d.data||d;if(data&&Array.isArray(data.books)){pendingBackup={data,photos:Array.isArray(d.photos)?d.photos:[]};ok=true}}catch(err){}
    if(!ok)pendingBackup=null;
    render();if(!ok){const m=$('#bkmsg');if(m)m.textContent=t('bad_json')}
    return}
  if(['et','ea','epg'].includes(e.target.id)&&openId&&get(openId)){
    const bk=get(openId),v=e.target.value.trim();
    if(e.target.id==='et'){if(v)bk.title=v}
    else if(e.target.id==='ea')bk.author=v;
    else bk.pages=parseInt(v,10)||0;
    save();draft={pi:($('#pi')||{}).value,pg:($('#pg')||{}).value};render();draft={};return}
  if(e.target.id==='ey'&&openId&&get(openId)){get(openId).year=parseInt(e.target.value,10)||0;save()}
});
setLang(lang);
migrate();save();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
