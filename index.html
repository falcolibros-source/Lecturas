<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis lecturas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#23201c;--mute:#7b756c;--line:#e6e0d6;--acc:#2f6f5e;--acc2:#e8f1ee;--warn:#b3472f}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--ink:#efebe4;--mute:#9a948a;--line:#34312d;--acc:#6fc2a9;--acc2:#1f2d29;--warn:#e07b62}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 90px}
h1{font-size:22px;margin:6px 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.cover{width:46px;height:64px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mute);font-size:13px}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
button{font:inherit}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.bad{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:6px 10px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stars button{border:0;background:none;font-size:28px;color:var(--line);padding:0 2px}
.stars button.on{color:#e0a526}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal.head span{text-align:center;font-size:12px;color:var(--mute)}
.day{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;color:#1b2b22}
.day small{font-size:10px;opacity:.7}.day b{font-size:13px;text-align:center;font-weight:600}
.day.today{outline:2px solid var(--acc);outline-offset:1px}
.l0{background:#fff}.l1{background:#d4edda}.l2{background:#9fd5ac}.l3{background:#4fa768;color:#fff}.l4{background:#1f6b3a;color:#fff}
.day.l3,.day.l4{color:#fff}
.legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.yb{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px}
.yb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.yb i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.yb span{font-size:10px;color:var(--mute)}
.lbl{display:flex;gap:4px;font-size:10px;color:var(--mute);margin-top:2px}
.lbl span{flex:1;text-align:center}
button:disabled{opacity:.35}
.filebtn{position:relative;overflow:hidden;display:inline-block;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.viewer img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px}
.vbar{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px}
.q{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.warn{background:var(--acc2);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='lecturas.v1';
let canSave=true;
let S={books:[],goal:12};
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.books))S=d}}catch(e){canSave=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));canSave=true}catch(e){canSave=false}}
const ST={reading:'Leyendo',done:'Terminado',dropped:'Abandonado'};
function migrate(){S.books.forEach(b=>{if(b.status==='want'){b.status='reading';if(!b.started)b.started=today()}})}
let view='reading',openId=null,adding=false,dataSheet=false,filter='all',msg='',delArm=false,impArm=false,lookup=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const pct=b=>b.pages>0?Math.min(100,Math.round(b.current/b.pages*100)):(b.status==='done'?100:0);
const get=id=>S.books.find(b=>b.id===id);
const cover=b=>`<div class="cover" style="background:hsl(${hue(b.title)} 38% 38%)">${esc((b.title||'?').trim().charAt(0).toUpperCase())}</div>`;

function bookRow(b){
  const p=pct(b);
  return `<div class="card" data-act="open" data-id="${b.id}"><div class="row">${cover(b)}<div class="grow">
  <div class="t">${esc(b.title)}</div><div class="m">${esc(b.author||'Autor desconocido')}${b.year?' ('+b.year+')':''} · ${ST[b.status]}${b.rating?' · '+'★'.repeat(b.rating):''}</div>
  ${b.status==='reading'?`<div class="bar"><i style="width:${p}%"></i></div><div class="m">${b.pages?`pág. ${b.current} de ${b.pages} · `:''}${p}%</div>`:''}
  </div></div></div>`;
}

function allSessions(){const a=[];S.books.forEach(b=>(b.sessions||[]).forEach(s=>a.push({...s,book:b})));return a}
function streak(){
  const days=new Set(allSessions().map(s=>s.date));
  let d=new Date(),n=0;
  if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}

function vReading(){
  const r=S.books.filter(b=>b.status==='reading');
  let h=`<h1>Mis lecturas</h1>`;
  if(!canSave)h+=`<div class="warn">No se puede guardar en este navegador. Usa «Copia de seguridad» para no perder datos.</div>`;
  h+=`<div class="card"><div class="row"><div class="grow"><div class="m">Libros terminados</div><div class="big">${S.books.filter(b=>b.status==='done').length}</div></div><div class="grow" style="text-align:right"><div class="m">Racha</div><div class="big">${streak()} 🔥</div></div></div></div>`;
  h+=`<h2>Leyendo ahora</h2>`+(r.length?r.map(bookRow).join(''):`<div class="empty">Nada en marcha. Pulsa + para añadir un libro.</div>`);
  return h;
}
let ordYear='all';
const fdate=d=>d?d.split('-').reverse().join('/'):'';
function orderRow(b,n){
  return `<div class="card" data-act="open" data-id="${b.id}"><div class="row"><div class="cover" style="background:hsl(${hue(b.title)} 38% 38%);font-size:18px">${n}</div><div class="grow">
  <div class="t">${esc(b.title)}</div><div class="m">${esc(b.author||'Autor desconocido')}${b.year?' ('+b.year+')':''}</div>
  <div class="m">${b.started?'Del '+fdate(b.started)+' ':''}al ${fdate(b.finished)}${b.rating?' · '+'★'.repeat(b.rating):''}</div></div></div></div>`;
}
function vLibrary(){
  const done=S.books.filter(b=>b.status==='done'&&b.finished).map((b,i)=>({b,i}))
    .sort((x,y)=>x.b.finished.localeCompare(y.b.finished)||x.i-y.i).map(x=>x.b);
  const last=Math.max(2026,new Date().getFullYear(),...done.map(b=>+b.finished.slice(0,4)));
  const years=[];for(let y=2026;y<=last;y++)years.push(String(y));
  if(ordYear!=='all'&&ordYear!=='dropped'&&!years.includes(ordYear))ordYear='all';
  const opts=[['all','Total leídos'],...years.map(y=>[y,'Leídos en '+y]),['dropped','Abandonados']];
  let h=`<h1>Biblioteca</h1><select id="ordsel" style="margin-bottom:12px">${opts.map(([k,v])=>`<option value="${k}" ${ordYear===k?'selected':''}>${v}</option>`).join('')}</select>`;
  if(ordYear==='dropped'){
    const d=S.books.filter(b=>b.status==='dropped');
    return h+(d.length?d.map(bookRow).join(''):`<div class="empty">No hay libros abandonados.</div>`);
  }
  const l=ordYear==='all'?done:done.filter(b=>b.finished.startsWith(ordYear));
  h+=l.length?`<div class="m" style="margin-bottom:8px">${l.length} ${l.length===1?'libro':'libros'}${ordYear==='all'?' hasta hoy':' en '+ordYear} · ${l.reduce((a,b)=>a+(b.pages||0),0)} páginas</div>`+l.map((b,i)=>orderRow(b,i+1)).join(''):`<div class="empty">Aún no hay libros terminados.</div>`;
  return h;
}
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MIN_IDX=2026*12+10,MAX_IDX=2950*12+11,MIN_Y=2026,MAX_Y=2950;
let calIdx=2026*12+10,statY=2026;
function pagesByDay(){const d={};allSessions().forEach(s=>{d[s.date]=(d[s.date]||0)+(s.pages||0)});return d}
const lvl=n=>n<=0?0:n<10?1:n<=20?2:n<=50?3:4;
function calendar(){
  const y=Math.floor(calIdx/12),m=calIdx%12,pd=pagesByDay();
  const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=today();
  let c='';
  for(let i=0;i<off;i++)c+='<div></div>';
  for(let d=1;d<=n;d++){
    const key=y+'-'+pad(m+1)+'-'+pad(d),v=pd[key]||0;
    c+=`<div class="day l${lvl(v)}${key===t?' today':''}"><small>${d}</small><b>${v||''}</b></div>`;
  }
  return `<div class="card"><div class="row"><button class="btn sec sm" data-act="mprev" ${calIdx<=MIN_IDX?'disabled':''}>‹</button><div class="grow" style="text-align:center;font-weight:600">${MESES[m]} ${y}</div><button class="btn sec sm" data-act="mnext" ${calIdx>=MAX_IDX?'disabled':''}>›</button></div>
  <div class="cal head">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="cal">${c}</div>
  <div class="legend"><span><i class="l0"></i>0</span><span><i class="l1"></i>&lt;10</span><span><i class="l2"></i>10–20</span><span><i class="l3"></i>20–50</span><span><i class="l4"></i>&gt;50</span></div></div>`;
}
function yearChart(){
  const m=Array(12).fill(0);
  allSessions().forEach(s=>{if(s.date.startsWith(statY+'-'))m[+s.date.slice(5,7)-1]+=s.pages||0});
  const tot=m.reduce((a,b)=>a+b,0),mx=Math.max(1,...m);
  return `<div class="card"><div class="row"><button class="btn sec sm" data-act="yprev" ${statY<=MIN_Y?'disabled':''}>‹</button><div class="grow" style="text-align:center;font-weight:600">${statY}</div><button class="btn sec sm" data-act="ynext" ${statY>=MAX_Y?'disabled':''}>›</button></div>
  <div class="m" style="text-align:center;margin-top:4px">Páginas leídas en el año: <b>${tot}</b></div>
  <div class="yb">${m.map(v=>`<div><span>${v||''}</span><i style="height:${v/mx*88}%"></i></div>`).join('')}</div>
  <div class="lbl">${'EFMAMJJASOND'.split('').map(c=>`<span>${c}</span>`).join('')}</div></div>`;
}
function vStats(){
  const done=S.books.filter(b=>b.status==='done');
  const auth={};done.forEach(b=>{if(b.author)auth[b.author]=(auth[b.author]||0)+1});
  const top=Object.entries(auth).sort((a,b)=>b[1]-a[1]).slice(0,3);
  let h=`<h1>Estadísticas</h1><h2>Días de lectura</h2>`+calendar()+`<h2>Páginas por año</h2>`+yearChart();
  h+=`<div class="card"><div class="m">Libros terminados</div><div class="big">${done.length}</div></div>`;
  if(top.length)h+=`<div class="card"><div class="m">Autores más leídos</div>${top.map(([a,n])=>`<div class="row"><div class="grow">${esc(a)}</div><b>${n}</b></div>`).join('')}</div>`;
  h+=`<button class="btn sec" style="width:100%" data-act="data">Copia de seguridad</button>`;
  return h;
}

let P=[],viewId=null,pdelArm=false,draft={},photoMsg='';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('lecturas-fotos',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id'}).createIndex('book','bookId')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const pstore=(db,m)=>db.transaction('photos',m).objectStore('photos');
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function clearP(){P.forEach(x=>URL.revokeObjectURL(x.url));P=[]}
async function loadPhotos(bid){
  try{const db=await idb();const all=await reqP(pstore(db,'readonly').index('book').getAll(bid));
    if(openId!==bid)return;clearP();all.sort((a,b)=>b.ts-a.ts);P=all.map(x=>({...x,url:URL.createObjectURL(x.blob)}));photoMsg=''}
  catch(e){photoMsg='Las fotos no se pueden guardar en este navegador.'}
}
async function delBookPhotos(bid){try{const db=await idb();const ks=await reqP(pstore(db,'readonly').index('book').getAllKeys(bid));for(const k of ks)await reqP(pstore(db,'readwrite').delete(k))}catch(e){}}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.75)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function viewer(){
  const x=P.find(q=>q.id===viewId);if(!x)return '';
  return `<div class="viewer" data-act="viewbg"><img src="${x.url}" alt=""><div class="vbar"><span>${fdate(x.date)}${x.page?' · pág. '+x.page:''}</span><button class="btn sec sm" data-act="vclose">Cerrar</button><button class="btn bad sm" data-act="vdel">${pdelArm?'Confirmar borrado':'Borrar'}</button></div></div>`;
}
function sheetBook(b){
  const p=pct(b);
  return `<div class="sheet" data-act="closebg"><div>
  <div class="row">${cover(b)}<div class="grow"><div class="t" style="white-space:normal;font-size:18px">${esc(b.title)}</div><div class="m">${esc(b.author||'Autor desconocido')}${b.pages?' · '+b.pages+' págs.':''}${b.year?' · '+b.year:''}</div></div><button class="btn sec sm" data-act="close">Cerrar</button></div>
  <label>Año de edición</label><input id="ey" type="number" min="0" inputmode="numeric" placeholder="p. ej. 1999" value="${b.year||''}">
  <label>Estado</label><div class="chips">${Object.entries(ST).map(([k,v])=>`<button class="chip ${b.status===k?'on':''}" data-act="status" data-id="${k}">${v}</button>`).join('')}</div>
  ${b.status==='reading'?`<label>Progreso</label><div class="bar"><i style="width:${p}%"></i></div><div class="m">${b.pages?`pág. ${b.current} de ${b.pages} · `:`pág. ${b.current} · `}${p}%</div>
  <div class="grid"><div><label>Página inicial</label><input id="pi" type="number" min="0" inputmode="numeric" value="${draft.pi!=null&&draft.pi!==''?draft.pi:b.current}"></div><div><label>Página final</label><input id="pg" type="number" min="0" inputmode="numeric" value="${draft.pg||''}"></div></div>  <button class="btn" style="width:100%;margin-top:10px" data-act="session">Registrar sesión</button>`:''}
  <label>Fotos del libro</label>
  <div class="row"><label class="btn sec sm filebtn">📷 Hacer foto<input id="cam" type="file" accept="image/*" capture="environment"></label><label class="btn sec sm filebtn">🖼️ Galería<input id="gal" type="file" accept="image/*"></label></div>
  ${photoMsg?`<div class="m">${esc(photoMsg)}</div>`:''}${P.length?`<div class="photos">${P.map(x=>`<img src="${x.url}" data-act="photo" data-id="${x.id}" alt="">`).join('')}</div>`:''}
  ${b.started||b.finished?`<div class="m" style="margin-top:10px">${b.started?'Empezado: '+b.started:''}${b.finished?' · Terminado: '+b.finished:''}</div>`:''}
  <label>Valoración</label><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${b.rating>=i?'on':''}" data-act="rate" data-id="${i}">★</button>`).join('')}</div>
  <label>Notas / reseña</label><textarea id="notes" placeholder="Qué te ha parecido…">${esc(b.notes||'')}</textarea>
  <button class="btn sec sm" style="margin-top:6px" data-act="savenotes">Guardar notas</button>
  <label>Citas favoritas</label>
  ${(b.quotes||[]).map((q,i)=>`<div class="q">${esc(q.text)}${q.page?` <span class="m">(pág. ${esc(q.page)})</span>`:''} <button class="chip" style="padding:0 8px;margin-left:6px" data-act="delq" data-id="${i}">×</button></div>`).join('')}
  <div class="grid" style="grid-template-columns:3fr 1fr"><input id="qt" placeholder="Nueva cita"><input id="qp" placeholder="Pág." inputmode="numeric"></div>
  <button class="btn sec sm" style="margin-top:6px" data-act="addq">Añadir cita</button>
  <div style="margin-top:22px"><button class="btn bad" data-act="del">${delArm?'Pulsa otra vez para borrar':'Borrar libro'}</button></div>
  </div></div>`;
}
function sheetAdd(){
  const l=lookup||{};
  return `<div class="sheet" data-act="closebg"><div>
  <div class="row"><h1 class="grow" style="margin:0">Nuevo libro</h1><button class="btn sec sm" data-act="close">Cerrar</button></div>
  <label>Título</label><input id="nt" value="${esc(l.title||'')}">
  <button class="btn sec sm" style="margin-top:6px" data-act="lookup">Buscar datos en Open Library</button><div class="m" id="lkmsg">${esc(msg)}</div>
  <label>Autor</label><input id="na" value="${esc(l.author||'')}">
  <div class="grid"><div><label>Páginas</label><input id="np" type="number" min="0" inputmode="numeric" value="${esc(l.pages||'')}"></div><div><label>Año de edición</label><input id="ny" type="number" min="0" inputmode="numeric" placeholder="p. ej. 1999" value="${esc(l.year||'')}"></div></div>
  <label>Estado</label><select id="ns"><option value="reading">Leyendo</option><option value="done">Terminado</option></select>
  <button class="btn" style="width:100%;margin-top:16px" data-act="create">Añadir</button>
  </div></div>`;
}
function sheetData(){
  return `<div class="sheet" data-act="closebg"><div>
  <div class="row"><h1 class="grow" style="margin:0">Copia de seguridad</h1><button class="btn sec sm" data-act="close">Cerrar</button></div>
  <div class="m" style="margin-top:8px">Las fotos se guardan solo en este dispositivo y no van en la copia de seguridad.</div>
  <label>Exportar: copia este texto y guárdalo en tus notas o en un mensaje a ti mismo</label>
  <textarea id="exp" readonly style="min-height:110px">${esc(JSON.stringify(S))}</textarea>
  <button class="btn sec sm" style="margin-top:6px" data-act="copy">Copiar</button> <span class="m" id="cpmsg"></span>
  <label>Importar: pega aquí una copia anterior (sustituye lo actual)</label>
  <textarea id="imp" placeholder="Pega el JSON"></textarea>
  <button class="btn ${impArm?'bad':'sec'} sm" style="margin-top:6px" data-act="import">${impArm?'Confirmar: sustituir datos':'Importar'}</button> <span class="m" id="immsg"></span>
  </div></div>`;
}

function render(){
  let h=view==='reading'?vReading():view==='library'?vLibrary():vStats();
  h+=`<button class="fab" data-act="add" aria-label="Añadir libro">+</button>
  <nav>${[['reading','📖 Leyendo'],['library','📚 Biblioteca'],['stats','📊 Datos']].map(([k,v])=>`<button class="${view===k?'on':''}" data-act="nav" data-id="${k}">${v}</button>`).join('')}</nav>`;
  if(openId&&get(openId))h+=sheetBook(get(openId))+(viewId?viewer():'');
  else if(adding)h+=sheetAdd();
  else if(dataSheet)h+=sheetData();
  $('#app').innerHTML=h;
}

function setStatus(b,s){
  b.status=s;
  if(s==='reading'&&!b.started)b.started=today();
  if(s==='done'){b.finished=today();if(!b.started)b.started=today();if(b.pages)b.current=b.pages}
  if(s!=='done')b.finished=b.finished&&s==='dropped'?b.finished:'';
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='closebg'){if(e.target!==el)return;openId=null;viewId=null;draft={};adding=false;dataSheet=false;delArm=false;impArm=false;render();return}
  const b=openId?get(openId):null;
  switch(a){
    case 'nav':view=id;render();break;
    case 'open':openId=id;delArm=false;clearP();draft={};photoMsg='';viewId=null;render();loadPhotos(id).then(()=>{if(openId===id)render()});break;
    case 'close':openId=null;viewId=null;draft={};adding=false;dataSheet=false;delArm=false;impArm=false;lookup=null;msg='';render();break;
    case 'add':adding=true;lookup=null;msg='';render();break;
    case 'data':dataSheet=true;render();break;
    case 'mprev':if(calIdx>MIN_IDX)calIdx--;render();break;
    case 'mnext':if(calIdx<MAX_IDX)calIdx++;render();break;
    case 'yprev':if(statY>MIN_Y)statY--;render();break;
    case 'ynext':if(statY<MAX_Y)statY++;render();break;
    case 'status':setStatus(b,id);save();render();break;
    case 'rate':b.rating=b.rating===+id?0:+id;save();render();break;
    case 'savenotes':b.notes=$('#notes').value;save();el.textContent='Guardado ✓';break;
    case 'addq':{const t=$('#qt').value.trim();if(!t)break;(b.quotes=b.quotes||[]).push({text:t,page:$('#qp').value.trim()});save();render();break}
    case 'delq':b.quotes.splice(+id,1);save();render();break;
    case 'session':{
      const ini=parseInt($('#pi').value,10),np=parseInt($('#pg').value,10);
      if(isNaN(ini)||isNaN(np)||ini<0||np<ini){$('#pg').focus();break}
      b.current=b.pages?Math.min(np,b.pages):np;
      (b.sessions=b.sessions||[]).push({date:today(),pages:np-ini,from:ini,to:np});
      if(b.pages&&b.current>=b.pages)setStatus(b,'done');
      draft={};save();render();break}
    case 'del':if(!delArm){delArm=true;render();break}
      delBookPhotos(openId);S.books=S.books.filter(x=>x.id!==openId);openId=null;delArm=false;save();render();break;
    case 'cam':$('#cam').click();break;
    case 'gal':$('#gal').click();break;
    case 'photo':viewId=id;pdelArm=false;render();break;
    case 'viewbg':if(e.target===el){viewId=null;render()}break;
    case 'vclose':viewId=null;render();break;
    case 'vdel':{
      if(!pdelArm){pdelArm=true;render();break}
      try{const db=await idb();await reqP(pstore(db,'readwrite').delete(viewId))}catch(err){}
      viewId=null;pdelArm=false;await loadPhotos(openId);render();break}
    case 'lookup':{
      const q=$('#nt').value.trim();if(!q)break;
      $('#lkmsg').textContent='Buscando…';
      try{
        const r=await fetch('https://openlibrary.org/search.json?limit=1&fields=title,author_name,number_of_pages_median&q='+encodeURIComponent(q));
        const d=await r.json();const x=d.docs&&d.docs[0];
        if(!x){msg='Sin resultados.';lookup={title:q,author:$('#na').value,pages:$('#np').value,year:$('#ny').value}}
        else{msg='';lookup={title:x.title,author:(x.author_name||[])[0]||'',pages:x.number_of_pages_median||'',year:$('#ny').value}}
      }catch(err){msg='Búsqueda no disponible aquí; rellena los datos a mano.';lookup={title:q,author:$('#na').value,pages:$('#np').value,year:$('#ny').value}}
      render();break}
    case 'create':{
      const title=$('#nt').value.trim();if(!title){$('#nt').focus();break}
      const nb={id:uid(),title,author:$('#na').value.trim(),pages:parseInt($('#np').value,10)||0,year:parseInt($('#ny').value,10)||0,status:'reading',current:0,rating:0,added:today(),started:'',finished:'',notes:'',quotes:[],sessions:[]};
      setStatus(nb,$('#ns').value);
      S.books.push(nb);save();adding=false;lookup=null;msg='';render();break}
    case 'copy':{
      const t=$('#exp');t.select();
      try{await navigator.clipboard.writeText(t.value);$('#cpmsg').textContent='Copiado ✓'}catch(err){$('#cpmsg').textContent='Copia manualmente el texto seleccionado'}
      break}
    case 'import':{
      if(!impArm){impArm=true;render();break}
      try{const d=JSON.parse($('#imp').value);if(!d||!Array.isArray(d.books))throw 0;S=d;migrate();save();impArm=false;dataSheet=false;render()}
      catch(err){impArm=false;render();$('#immsg').textContent='JSON no válido'}
      break}
  }
});
document.addEventListener('change',async e=>{
  if((e.target.id==='cam'||e.target.id==='gal')&&openId){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const bid=openId;draft={pi:($('#pi')||{}).value,pg:($('#pg')||{}).value};
    try{const blob=await shrink(f);const db=await idb();
      await reqP(pstore(db,'readwrite').put({id:uid(),bookId:bid,ts:Date.now(),date:today(),page:parseInt(draft.pg,10)||0,blob}));
      await loadPhotos(bid);photoMsg=''}
    catch(err){photoMsg='No se pudo guardar la foto en este navegador.'}
    if(openId===bid)render();
    draft={};return}
  if(e.target.id==='ordsel'){ordYear=e.target.value;render();return}
  if(e.target.id==='ey'&&openId&&get(openId)){get(openId).year=parseInt(e.target.value,10)||0;save()}
});
migrate();save();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
